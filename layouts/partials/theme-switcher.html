<div class="theme-switcher">
    <button id="theme-toggle" class="theme-toggle" aria-label="Change theme">
        <svg class="theme-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2V6M12 18V22M4.93 4.93L7.76 7.76M16.24 16.24L19.07 19.07M2 12H6M18 12H22M4.93 19.07L7.76 16.24M16.24 7.76L19.07 4.93" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>
    
    <div class="theme-dropdown" id="theme-dropdown">
        <div class="theme-option" data-theme="default">
            <div class="theme-preview theme-preview-default"></div>
            <span>Default</span>
        </div>
        <div class="theme-option" data-theme="ocean">
            <div class="theme-preview theme-preview-ocean"></div>
            <span>Ocean</span>
        </div>
        <div class="theme-option" data-theme="forest">
            <div class="theme-preview theme-preview-forest"></div>
            <span>Forest</span>
        </div>
        <div class="theme-option" data-theme="night">
            <div class="theme-preview theme-preview-night"></div>
            <span>Night</span>
        </div>
    </div>
</div>
